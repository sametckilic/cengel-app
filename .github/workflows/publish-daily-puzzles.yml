name: Validate puzzle platform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-puzzle-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare clue catalog
        run: npm run dataset:build

      - name: Verify generated content
        run: |
          npm run lint
          npx tsc --noEmit
          npm run dataset:check
          npm run test:generator
          npm run puzzles:check
          npm run test:engine
          npm run test:progress

      - name: Export deployable Expo server bundle
        run: npm run server:build

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: cengel-server-bundle
          path: apps/mobile/dist
          if-no-files-found: error
          retention-days: 7

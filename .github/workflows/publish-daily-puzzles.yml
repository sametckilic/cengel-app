name: Publish daily puzzles

on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:

concurrency:
  group: publish-daily-puzzles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare clue catalog
        run: npm run dataset:build

      - name: Publish seven-day buffer
        run: npm run daily:publish -- --start tomorrow --days 7 --revision schedule-v1 --publish

      - name: Verify generated content
        run: |
          npm run lint
          npx tsc --noEmit
          npm run dataset:check
          npm run test:generator
          npm run puzzles:check
          npm run test:engine
          npm run test:progress

      - name: Commit generated publications
        run: |
          git config user.name "cengel-publisher[bot]"
          git config user.email "cengel-publisher[bot]@users.noreply.github.com"
          git add data/generated
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: publish daily puzzles"
            git push
          fi

      - name: Export deployable Expo server bundle
        run: npx expo export --platform web

      - name: Upload server bundle
        uses: actions/upload-artifact@v4
        with:
          name: cengel-server-bundle
          path: dist
          if-no-files-found: error
          retention-days: 7

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cengel
      POSTGRES_PASSWORD: cengel
      POSTGRES_USER: cengel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cengel -d cengel"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "54329:5432"
    volumes:
      - cengel-postgres-data:/var/lib/postgresql/data

volumes:
  cengel-postgres-data:
